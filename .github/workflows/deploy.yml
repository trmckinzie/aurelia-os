name: Deploy Aurelia OS

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Default to no permissions; each job grants only what it needs (least privilege).
permissions: {}

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Build Script
        # --no-sort, always, in CI. Without it the build runs
        # organize_assets(), the one step that WRITES to vault/: it moves
        # everything under vault/99_DROP_ZONE/ into vault/assets/<kind>/,
        # and sync_vault_assets() then copies audio/video/images/flashcards
        # from there into dist/ with no `publish:` gate of any kind. So an
        # unsorted file sitting in the drop zone at push time gets published
        # to the live site by CI, having been reviewed by nobody.
        #
        # engine/pipeline.py's build_all() docstring names CI as exactly the
        # place this must not happen. The runner's checkout is a throwaway,
        # so the vault mutation itself is invisible -- only its output ships.
        run: python build.py --no-sort

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4