name: Deploy personal site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Default to no permissions; each job grants only what it needs (least privilege).
permissions: {}

# Every action is pinned to a full commit SHA, with its version in a comment.
# A tag can be moved after the fact; a SHA cannot. Dependabot (see
# .github/dependabot.yml) proposes the bumps, so the comments stay accurate.
jobs:
  check:
    runs-on: ubuntu-latest
    # 20, up from 15, for the browser suite (about two minutes locally).
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python Dependencies
        # --require-hashes: every package, including transitive ones, must match
        # a sha256 in the lock file or the install fails.
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        # The browser suite in verify.sh needs it (roadmap S08). --with-deps
        # adds the system libraries Chromium needs on ubuntu, which needs
        # sudo, so it runs here rather than in verify.sh, whose own install
        # is then a no-op. Not cached: Playwright's docs advise against it,
        # since restoring takes about as long as downloading and the system
        # libraries cannot be cached anyway. The version is the one pinned in
        # package-lock.json, so a Dependabot bump brings its browser with it.
        run: npx --no-install playwright install --with-deps chromium

      - name: Run full check suite
        # pytest, pyflakes, the vault schema check, the roadmap check, a
        # --no-sort --strict build (verify.sh adds --strict on GitHub only),
        # then the browser suite with axe on that build. Same suite Travis
        # runs locally before pushing, so CI can't pass on something the
        # local run missed.
        run: bash verify.sh

      - name: Keep browser-suite failure screenshots and traces
        # Only when something failed. Download the artifact from the run's
        # summary page and open a trace with `npx playwright show-trace
        # <trace.zip>`, or open playwright-report/index.html (docs/DECISIONS.md
        # item 30).
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-suite-failures-ubuntu
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # The same suite on the platform the Mac mini will run, so a macOS-only
  # problem shows up in CI before it shows up on the machine. Deliberately NOT
  # in build's `needs`: the site is built and published from the ubuntu jobs, so
  # a macOS failure (or a runner outage) should be seen and fixed without
  # holding up a deploy. If this job is ever made required, add it to `needs`.
  check-macos:
    runs-on: macos-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright's Chromium
        # Same as the check job. Runs the browser suite here too, for parity;
        # this job stays out of build's `needs`, so a failure here is seen
        # without blocking a merge or a deploy.
        run: npx --no-install playwright install --with-deps chromium

      - name: Run full check suite
        run: bash verify.sh

      - name: Keep browser-suite failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-suite-failures-macos
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    if: github.event_name != 'pull_request'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      commit: ${{ steps.commit-stamp.outputs.commit }}
      commit_time: ${{ steps.commit-stamp.outputs.commit_time }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine commit stamp
        # The commit actually being built, and ITS OWN timestamp -- not the
        # wall-clock time this step happens to run at. A retry or a re-run
        # of the same commit then stamps identical values, which is what
        # keeps this compatible with S09's byte-identical-build goal. A
        # shallow checkout (actions/checkout's default) still has this one
        # commit's own metadata, so neither command needs full history.
        id: commit-stamp
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "commit_time=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Build Script
        # --no-sort, always, in CI. Without it the build runs
        # organize_assets(), the one step that WRITES to vault/: it moves
        # everything under vault/99_DROP_ZONE/ into vault/assets/<kind>/.
        # That is a write to the vault on a throwaway runner, reviewed by
        # nobody. The media publish gate (backlog B06) keeps an unreferenced
        # file off the site, but a drop-zone file a published note already
        # names would ship, and the vault write itself is the thing CI must
        # never do.
        #
        # engine/pipeline.py's build_all() docstring names CI as exactly the
        # place this must not happen. The runner's checkout is a throwaway,
        # so the vault mutation itself is invisible -- only its output ships.
        #
        # --strict: any build warning (malformed frontmatter, a missing
        # asset, an ambiguous alias) exits non-zero, so a degraded site never
        # reaches upload. verify.sh in the check job builds the same way.
        #
        # AURELIA_BUILD_COMMIT(_TIME): stamped into every page's <meta> by
        # engine/pipeline.py's _build_commit_stamp (roadmap S06), read back
        # by the live-check job below and by the rollback runbook
        # (docs/ROLLBACK.md). Passed via env:, not interpolated into this
        # script, even though both values come from git rather than a user.
        env:
          AURELIA_BUILD_COMMIT: ${{ steps.commit-stamp.outputs.commit }}
          AURELIA_BUILD_COMMIT_TIME: ${{ steps.commit-stamp.outputs.commit_time }}
        run: python build.py --no-sort --strict

      - name: Upload Artifact
        # v4 and later leave dotfiles out of the artifact. The build writes
        # none, so the default is right; set include-hidden-files if that changes.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Nothing looked at the live site after deploy-pages reported success
  # (roadmap S06's "why"). This job does: it fetches the Lobby, Garden,
  # About and a deliberately missing page and confirms the live Lobby
  # reports exactly the commit `build` just built. Read-only against
  # everything, so it needs no write permission at all.
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, deploy]
    if: github.event_name != 'pull_request'
    permissions: {}
    steps:
      - name: Checkout
        # Only to pull in .github/actions/live-check -- this job reads
        # nothing else from the checkout and writes nothing anywhere.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the live site
        uses: ./.github/actions/live-check
        with:
          site-url: ${{ needs.deploy.outputs.page_url }}
          expected-commit: ${{ needs.build.outputs.commit }}

  # Tags and releases the deploy once the live check has proven it good --
  # not merely once deploy-pages reported success, since that only means
  # the upload succeeded, not that the site answers correctly. The only job
  # in this workflow with contents: write; every other job is read-only or
  # has no permissions at all.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, live-check]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - name: Tag and publish a release
        # No checkout needed: gh release create can tag a commit by SHA
        # directly via the API, so this never touches local git credentials
        # (every checkout above runs persist-credentials: false on purpose).
        #
        # The tag name is deterministic from the commit alone (its own
        # timestamp + the first 7 hex characters of its SHA), not from when
        # this job happens to run -- so a re-run of the same commit (a retry,
        # or this job re-running after a transient failure) reaches the same
        # tag name instead of minting a duplicate. gh release view catches
        # that case and skips rather than erroring.
        #
        # redeploy.yml's strict tag-name validation
        # (^deploy-[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$) must keep matching
        # whatever this step produces.
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.build.outputs.commit }}
          COMMIT_TIME: ${{ needs.build.outputs.commit_time }}
        run: |
          set -euo pipefail
          short="${COMMIT:0:7}"
          stamp="$(date -u -d "$COMMIT_TIME" +%Y%m%d-%H%M%S)"
          tag="deploy-${stamp}-${short}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists (retry of a previous run) -- skipping."
            exit 0
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT" \
            --title "Deploy $stamp ($short)" \
            --generate-notes
          echo "Published release $tag for $COMMIT"
