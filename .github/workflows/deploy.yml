name: Deploy personal site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Default to no permissions; each job grants only what it needs (least privilege).
permissions: {}

# Every action is pinned to a full commit SHA, with its version in a comment.
# A tag can be moved after the fact; a SHA cannot. Dependabot (see
# .github/dependabot.yml) proposes the bumps, so the comments stay accurate.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python Dependencies
        # --require-hashes: every package, including transitive ones, must match
        # a sha256 in the lock file or the install fails.
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run full check suite
        # pytest, pyflakes, the vault schema check, the roadmap check, then a
        # --no-sort build -- see verify.sh. Same suite Travis runs locally
        # before pushing, so CI can't pass on something the local run missed.
        run: bash verify.sh

  # The same suite on the platform the Mac mini will run, so a macOS-only
  # problem shows up in CI before it shows up on the machine. Deliberately NOT
  # in build's `needs`: the site is built and published from the ubuntu jobs, so
  # a macOS failure (or a runner outage) should be seen and fixed without
  # holding up a deploy. If this job is ever made required, add it to `needs`.
  check-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run full check suite
        run: bash verify.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    if: github.event_name != 'pull_request'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: '.python-version'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install --require-hashes -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Build Script
        # --no-sort, always, in CI. Without it the build runs
        # organize_assets(), the one step that WRITES to vault/: it moves
        # everything under vault/99_DROP_ZONE/ into vault/assets/<kind>/,
        # and sync_vault_assets() then copies audio/video/images/flashcards
        # from there into dist/ with no `publish:` gate of any kind. So an
        # unsorted file sitting in the drop zone at push time gets published
        # to the live site by CI, having been reviewed by nobody.
        #
        # engine/pipeline.py's build_all() docstring names CI as exactly the
        # place this must not happen. The runner's checkout is a throwaway,
        # so the vault mutation itself is invisible -- only its output ships.
        run: python build.py --no-sort

      - name: Upload Artifact
        # v4 and later leave dotfiles out of the artifact. The build writes
        # none, so the default is right; set include-hidden-files if that changes.
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
