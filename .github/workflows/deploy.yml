name: Deploy personal site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

# Default to no permissions; each job grants only what it needs (least privilege).
permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements-dev.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run full check suite
        # pytest, pyflakes, the vault schema check, the roadmap check, then a
        # --no-sort build -- see verify.sh. Same suite Travis runs locally
        # before pushing, so CI can't pass on something the local run missed.
        run: bash verify.sh

  build:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name != 'pull_request'
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Build Script
        # --no-sort, always, in CI. Without it the build runs
        # organize_assets(), the one step that WRITES to vault/: it moves
        # everything under vault/99_DROP_ZONE/ into vault/assets/<kind>/,
        # and sync_vault_assets() then copies audio/video/images/flashcards
        # from there into dist/ with no `publish:` gate of any kind. So an
        # unsorted file sitting in the drop zone at push time gets published
        # to the live site by CI, having been reviewed by nobody.
        #
        # engine/pipeline.py's build_all() docstring names CI as exactly the
        # place this must not happen. The runner's checkout is a throwaway,
        # so the vault mutation itself is invisible -- only its output ships.
        run: python build.py --no-sort

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4