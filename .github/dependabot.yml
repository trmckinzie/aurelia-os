# Weekly version updates for the three dependency surfaces this repo has.
# Minor and patch bumps arrive as one grouped PR per ecosystem; a major bump
# arrives on its own, because it is the one most likely to need a real look
# (tailwindcss 3 to 4, for example, changed the config format; roadmap S12
# did that one by hand).
#
# Every PR runs the full check suite (see deploy.yml), and nothing merges
# itself. Each ecosystem waits 7 days after a release before proposing it, the
# release-age quarantine of Dev Roadmap ADR-006 (npm's min-release-age setting
# does not bind Dependabot, which resolves versions itself). Security updates are a separate GitHub setting and ignore this file's
# schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm:
        update-types: [minor, patch]
