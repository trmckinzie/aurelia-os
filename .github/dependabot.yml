# Weekly version updates for the three dependency surfaces this repo has.
# Minor and patch bumps arrive as one grouped PR per ecosystem; a major bump
# arrives on its own, because it is the one most likely to need a real look
# (tailwindcss 3 to 4, for example, changes the config format).
#
# Every PR runs the full check suite (see deploy.yml), and nothing merges
# itself. Security updates are a separate GitHub setting and ignore this file's
# schedule.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        update-types: [minor, patch]
